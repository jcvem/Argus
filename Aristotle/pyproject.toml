[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aristotle-api"
version = "0.1.0"
description = "Argus Aristotle: Natural-language policy drafting and consistency service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "google-genai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aristotle_api"]
