[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redact-core"
version = "0.1.0"
description = "Argus RedactCore: Policy-driven privacy-preserved document views"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "presidio-analyzer>=2.2.355",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
redact-core = "redact_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redact_core"]
