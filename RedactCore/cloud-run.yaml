apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: redact-core-demo
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Argus RedactCore Hosted Demo API (ephemeral storage, demo identity context)"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/redact-core:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: PORT
              value: "8080"
            - name: REDACTCORE_STORAGE_DIR
              value: "/tmp/redactcore-data"
            - name: REDACTCORE_ENABLE_DEMO_FIXTURES
              value: "true"
            - name: REDACTCORE_POLICIES_DIR
              value: "/app/policies"
            - name: REDACTCORE_FIXTURES_DIR
              value: "/app/fixtures"
            - name: REDACTCORE_WEB_DIR
              value: "/app/web"
            - name: REDACTCORE_CORS_ORIGINS
              value: "http://localhost:8080,http://127.0.0.1:8080"
            - name: REDACTCORE_MAX_UPLOAD_BYTES
              value: "20971520"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
