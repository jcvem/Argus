policy_id: "reviewer"
name: "Compliance Reviewer Policy"
version: "1.0.0"
description: "Compliance/Privacy Reviewer view. Highlights findings, flags uncertain candidates for human review, and requires review of embedded figures."
default_action: "review"
require_figure_review: true
rules:
  - entity_type: "SALARY"
    action: "review"
    description: "Requires explicit signoff before release"
  - entity_type: "EMPLOYEE_ID"
    action: "mask"
    mask_char: "*"
    description: "Partially masked ID pending review"
  - entity_type: "PHONE_NUMBER"
    action: "review"
    description: "Requires confirmation"
  - entity_type: "EMAIL_ADDRESS"
    action: "review"
    description: "Requires confirmation"
  - entity_type: "PERSON"
    action: "review"
    description: "Requires confirmation"
